services:
  postgres:
    image: postgres:15-alpine
    container_name: rh_postgres
    environment:
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: rh_password
      POSTGRES_DB: rh_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rh_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rh_backend
    environment:
      DATABASE_URL: postgresql://rh_user:rh_password@postgres:5432/rh_system
      JWT_SECRET: super_secret_jwt_key_2024_rh_system
      PORT: 3001
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://192.168.100.135:3000
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - rh_network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://192.168.100.135:3001
    container_name: rh_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://192.168.100.135:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - rh_network

volumes:
  postgres_data:

networks:
  rh_network:
    driver: bridge
